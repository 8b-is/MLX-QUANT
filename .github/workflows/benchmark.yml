name: Universal Benchmark Matrix

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'benchmark_results.json'
  schedule:
    - cron: '0 0 * * *' # Run daily

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run Benchmark Matrix
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run scripts/mlx_bench_matrix_yall.py --format json > benchmark_results.json
          
      - name: Commit Results to Repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add benchmark_results.json
          git commit -m "chore: Update benchmark_results.json via CI" || echo "No changes to commit"
          git push origin main
