name: CPU CI

# Every substantial job in build_and_test.yml (build_and_test, mac_build,
# mac_test, build_documentation) is gated on
# `if: github.repository == 'ml-explore/mlx'`, so none of them run on this
# fork -- only check_lint/sanitizer/fedora jobs do. This workflow fills that
# gap for the CPU-only (no Metal, no CUDA) build + test path specifically,
# using a standard GitHub-hosted runner. Metal builds need real Apple
# hardware and remain outside this CPU-only workflow.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpu-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cpu_build_and_test:
    name: CPU-only build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Email helper regressions
        run: python3 -m unittest discover -s scripts -p test_send_email.py -v

      - name: Golden-logit CLI regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/mlx-golden-tests"
          "$RUNNER_TEMP/mlx-golden-tests/bin/python" -m pip install numpy==2.5.3
          "$RUNNER_TEMP/mlx-golden-tests/bin/python" -m unittest discover -s scripts -p test_quantal_compare_logits.py -v

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            libblas-dev \
            liblapacke-dev \
            libopenblas-dev \
            cmake \
            ninja-build
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Configure (CPU-only, no Metal, no CUDA)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLX_BUILD_METAL=OFF \
            -DMLX_BUILD_CUDA=OFF \
            -DMLX_BUILD_TESTS=ON \
            -DMLX_BUILD_PYTHON_BINDINGS=OFF \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ./build/tests/tests
