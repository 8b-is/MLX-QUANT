name: cogito-corpus-sync

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC token — the HF Trusted Publisher turns it into a short-lived HF token
  contents: read

concurrency:
  group: cogito-corpus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HF hub CLI (OIDC trusted publisher)
        run: |
          pip install -U "huggingface_hub[cli]"
          hf --version

      - name: Run the Cogito corpus build (clone → extract → scrub → sync)
        run: |
          python scripts/build_cogito_corpus.py
        env:
          # Trusted Publisher via OIDC: `HF_OIDC_RESOURCE` asks the hub to
          # exchange this workflow's GitHub OIDC token for a short-lived HF
          # token scoped to the bucket — no long-lived HF_TOKEN needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_OIDC_RESOURCE: "bucket:PeetPedro/cogitoergosumma-corpus"
          HF_TOKEN: ""

      - name: Final dataset visibility check
        run: |
          hf download PeetPedro/cogitoergosumma-corpus --repo-type dataset \
            --local-dir /tmp/cogito-check
          echo "dataset files: $(find /tmp/cogito-check -name '*.jsonl' | wc -l)"
