repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    # Large numeric arrays hit clang-format's slow path; keep this fixture
    # formatted and validated with the JSON-native hook instead.
    -   id: pretty-format-json
        files: ^scripts/quantal_ref_logits\.json$
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]
    # -   id: end-of-file-fixer
    # -   id: trailing-whitespace
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
    -   id: clang-format
        # The JSON-native hook above owns this exact file.
        exclude: ^scripts/quantal_ref_logits\.json$
# Using this mirror lets us use mypyc-compiled black, which is about 2x faster
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
    -   id: black
    
-   repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
    -   id: isort
        args:
            - --profile=black
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
    - id: cmake-format
