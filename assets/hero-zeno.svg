<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0F1E"/>
      <stop offset="1" stop-color="#0F0813"/>
    </linearGradient>
    <linearGradient id="hero-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4D9D"/>
      <stop offset="1" stop-color="#FF8FC0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="640" fill="url(#hero-bg)"/>
  <rect x="14" y="14" width="1572" height="612" fill="none" stroke="#FF4D9D" stroke-opacity="0.25" stroke-width="2" rx="24"/>

  <!-- ternary field: trit glyphs -->
  <g fill="#FF4D9D" fill-opacity="0.16">
    <text x="40" y="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" letter-spacing="26">−1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1 −1 0 +1</text>
  </g>

  <!-- mark -->
  <g transform="translate(330 320)">
    <circle r="238" fill="none" stroke="#62E6C9" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="2 12"/>
    <line x1="-158" y1="0" x2="128" y2="0" stroke="url(#hero-pink)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 122 -5 L 196 0 L 122 5 Z" fill="#FF4D9D"/>
    <path d="M 0 -176 L 152 124 L -152 124 Z" fill="none" stroke="#FF4D9D" stroke-opacity="0.85" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="0" cy="-176" r="16" fill="#1A0F1E" stroke="#FF8FC0" stroke-width="6"/>
    <circle cx="-152" cy="124" r="16" fill="#1A0F1E" stroke="#FF4D9D" stroke-width="6"/>
    <circle cx="152" cy="124" r="16" fill="#1A0F1E" stroke="#FF4D9D" stroke-width="6"/>
    <circle cx="0" cy="0" r="19" fill="#62E6C9"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="700" y="250" font-size="110" font-weight="700" letter-spacing="40" fill="#FFFFFF">ZENO</text>
    <text x="700" y="310" font-size="34" letter-spacing="18" fill="#FF4D9D">M L X · Q U A N T</text>
    <text x="700" y="378" font-size="24" letter-spacing="10" fill="#62E6C9">v2.0.0-RC1 — direct-to-Metal ternary · { −1, 0, +1 }</text>
    <text x="700" y="414" font-size="20" letter-spacing="8" fill="#A59FC4">the GPU brain of the ayeOS mesh · fine touch from within · vaked.dev</text>
  </g>

  <!-- corner glyphs -->
  <text x="40" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="6" fill="#FF4D9D" fill-opacity="0.8">0 + 1</text>
  <text x="1430" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="6" fill="#62E6C9" fill-opacity="0.8">8b-is</text>
</svg>
